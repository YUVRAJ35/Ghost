<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OderisMC | Under Development</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #111d35 0%,
                    #060911 45%,
                    #020308 100%
                );

            color: #f0f6ff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: min(90%, 750px);
            text-align: center;
            padding: 55px 35px;

            background: rgba(13, 20, 36, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 24px;

            box-shadow:
                0 0 50px rgba(0, 243, 255, 0.12),
                inset 0 0 30px rgba(0, 243, 255, 0.03);

            backdrop-filter: blur(15px);
        }

        .logo {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 900;
            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #00f3ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 25px;
        }

        .status {
            display: inline-block;

            padding: 9px 18px;
            margin-bottom: 25px;

            border: 1px solid #00f3ff;
            border-radius: 30px;

            color: #00f3ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;

            box-shadow:
                0 0 15px rgba(0, 243, 255, 0.2);
        }

        h1 {
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 18px;
        }

        p {
            color: #8ba0c2;
            font-size: 18px;
            line-height: 1.7;
        }

        .studio {
            margin-top: 28px;

            color: #00f3ff;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .soon {
            margin-top: 35px;

            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;

            background: #00ff88;
            border-radius: 50%;

            box-shadow: 0 0 12px #00ff88;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.7);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 22px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="status">
            <span class="pulse"></span>
            Under Development
        </div>

        <div class="logo">
            ODERISMC
        </div>

        <h1>
            We'll Be Back Soon!
        </h1>

        <p>
            OderisMC is currently under development
            under <strong>YJDEV STUDIOS</strong>.
            We're working behind the scenes to bring
            the network back better than ever.
        </p>

        <div class="studio">
            YJDEV STUDIOS
        </div>

        <div class="soon">
            ⚡ Stay Tuned • Coming Back Soon ⚡
        </div>

    </main>

</body>
</html>
